<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIHSS 中風量表｜看懂中風 AI 教學圖卡</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<main class="card">
  <p class="series" data-field="series">看懂中風 AI 教學圖卡</p>
  <header>
    <h1 data-field="title">NIHSS 中風量表</h1>
    <p class="sub" data-field="subtitle">床邊幫中風嚴重度打分數</p>
  </header>
  <section class="block" data-n="1" data-icon="a doctor's clipboard checklist with tick boxes">
    <h2><span class="badge">①</span><span data-field="b1-head">它是什麼</span></h2>
    <p data-field="b1-body">美國國衛院中風量表，11 項床邊神經檢查。</p>
  </section>
  <section class="block" data-n="2" data-icon="a tiny hand-grip strength test and a simple eye icon">
    <h2><span class="badge">②</span><span data-field="b2-head">怎麼算</span></h2>
    <p data-field="b2-body">意識、眼球、臉、手腳力氣、感覺、語言逐項給分，總分 0–42。</p>
  </section>
  <section class="block" data-n="3" data-icon="a horizontal score bar labelled 0 and 42, fading from mint green to coral red">
    <h2><span class="badge">③</span><span data-field="b3-head">怎麼看</span></h2>
    <p data-field="b3-body">分數越高越嚴重；0 分代表沒有明顯神經缺損。</p>
  </section>
  <aside class="bubble" data-field="bubble">AI 預後模型常用它當特徵！</aside>
  <footer><span data-field="author">北醫 G167114005 鄭為遠</span><span data-field="page">1/3</span></footer>
</main>
</body>
</html>
