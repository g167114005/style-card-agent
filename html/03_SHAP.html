<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAP 特徵貢獻｜看懂中風 AI 教學圖卡</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<main class="card">
  <p class="series" data-field="series">看懂中風 AI 教學圖卡</p>
  <header>
    <h1 data-field="title">SHAP 特徵貢獻</h1>
    <p class="sub" data-field="subtitle">每個特徵把預測推多少？</p>
  </header>
  <section class="block" data-n="1" data-icon="four tiny team members sharing one trophy">
    <h2><span class="badge">①</span><span data-field="b1-head">它是什麼</span></h2>
    <p data-field="b1-body">像小組分功勞：算出每個特徵把預測往上推或往下拉多少。</p>
  </section>
  <section class="block" data-n="2" data-icon="puzzle pieces being added and removed with plus and minus signs">
    <h2><span class="badge">②</span><span data-field="b2-head">怎麼算</span></h2>
    <p data-field="b2-body">讓特徵輪流加入或拿掉，比較預測變化，再取平均。</p>
  </section>
  <section class="block" data-n="3" data-icon="a horizontal bar chart with coral bars pushing right and baby-blue bars pushing left, plus a small warning sign">
    <h2><span class="badge">③</span><span data-field="b3-head">要小心</span></h2>
    <p data-field="b3-body">特徵高度相關時排名會變；排名高不等於有額外預測價值。</p>
  </section>
  <aside class="bubble" data-field="bubble">解釋模型，不是人體因果！</aside>
  <footer><span data-field="author">北醫 G167114005 鄭為遠</span><span data-field="page">3/3</span></footer>
</main>
</body>
</html>
