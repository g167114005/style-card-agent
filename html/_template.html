<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}｜看懂中風 AI 教學圖卡</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<main class="card">
  <p class="series" data-field="series">看懂中風 AI 教學圖卡</p>
  <header>
    <h1 data-field="title">{{title ≤12字}}</h1>
    <p class="sub" data-field="subtitle">{{subtitle ≤14字}}</p>
  </header>
  <section class="block" data-n="1" data-icon="{{英文小插圖描述}}">
    <h2><span class="badge">①</span><span data-field="b1-head">{{≤6字}}</span></h2>
    <p data-field="b1-body">{{≤34字}}</p>
  </section>
  <section class="block" data-n="2" data-icon="{{英文小插圖描述}}">
    <h2><span class="badge">②</span><span data-field="b2-head">{{≤6字}}</span></h2>
    <p data-field="b2-body">{{≤34字}}</p>
  </section>
  <section class="block" data-n="3" data-icon="{{英文小插圖描述}}">
    <h2><span class="badge">③</span><span data-field="b3-head">{{≤6字}}</span></h2>
    <p data-field="b3-body">{{≤34字}}</p>
  </section>
  <aside class="bubble" data-field="bubble">{{≤14字}}</aside>
  <footer><span data-field="author">北醫 G167114005 鄭為遠</span><span data-field="page">n/3</span></footer>
</main>
</body>
</html>
